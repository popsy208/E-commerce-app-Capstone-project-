apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend-green
  namespace: ecommerce

spec:
  replicas: 0

  selector:
    matchLabels:
      app: frontend
      version: green

  template:
    metadata:
      labels:
        app: frontend
        version: green

    spec:
      containers:
      - name: frontend

        image: ecommerce-app-frontend:latest

        imagePullPolicy: Never

        ports:
        - containerPort: 80