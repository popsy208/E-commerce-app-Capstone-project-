apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend-green
  namespace: ecommerce

spec:
  replicas: 0

  selector:
    matchLabels:
      app: ecommerce-frontend
      version: green

  template:
    metadata:
      labels:
        app: frontend
        version: green

    spec:
      containers:
      - name: ecommerce-frontend

        image: 046819497518.dkr.ecr.eu-west-2.amazonaws.com/ecommerce-frontend:latest

        imagePullPolicy: Always

        ports:
        - containerPort: 80