apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend-green
  namespace: ecommerce

spec:
  replicas: 0

  selector:
    matchLabels:
      app: backend
      version: green

  template:
    metadata:
      labels:
        app: backend
        version: green

    spec:
      containers:
      - name: ecommerce-backend

        image: 046819497518.dkr.ecr.eu-west-2.amazonaws.com/ecommerce-backend:latest

        imagePullPolicy: Always

        ports:
        - containerPort: 3000

        env:
        - name: DATABASE_URL
          value: postgresql://postgres:postgres123@postgres:5432/ecommercedb

        - name: JWT_SECRET
          value: mysecretkey

        - name: JWT_EXPIRES_IN
          value: 1d